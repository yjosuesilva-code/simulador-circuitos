<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Circuitos Eléctricos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-body-tertiary">

  <nav class="navbar bg-dark" data-bs-theme="dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">⚡ Simulador de Circuitos</span>
      <span class="navbar-text small" id="circuit-name">Cargando…</span>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <div class="row g-3">

      <!-- Barra de componentes: arrastrar al lienzo o hacer clic -->
      <aside class="col-12 col-lg-2">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Componentes</div>
          <div class="list-group list-group-flush" id="toolbar">
            <button class="list-group-item list-group-item-action toolbar-item" data-type="R">Resistencia</button>
            <button class="list-group-item list-group-item-action toolbar-item" data-type="C">Capacitor</button>
            <button class="list-group-item list-group-item-action toolbar-item" data-type="L">Inductor</button>
            <button class="list-group-item list-group-item-action toolbar-item" data-type="V">Fuente DC</button>
            <button class="list-group-item list-group-item-action toolbar-item" data-type="VAC">Fuente AC</button>
            <button class="list-group-item list-group-item-action toolbar-item" data-type="I">Fuente de corriente</button>
            <button class="list-group-item list-group-item-action toolbar-item" data-type="GND">Tierra</button>
          </div>
          <div class="card-footer small text-body-secondary">
            Arrastra un componente al lienzo.<br>
            <kbd>R</kbd> rotar · <kbd>Supr</kbd> eliminar · <kbd>Esc</kbd> deseleccionar
          </div>
        </div>
      </aside>

      <!-- Lienzo del circuito -->
      <section class="col-12 col-lg-6">
        <div class="card shadow-sm h-100">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Circuito</span>
            <div class="d-flex gap-2">
              <button class="btn btn-outline-secondary btn-sm" id="btn-rotate" disabled title="Rotar (R)">⟳ Rotar</button>
              <button class="btn btn-outline-danger btn-sm" id="btn-delete" disabled title="Eliminar (Supr)">✕ Eliminar</button>
              <button class="btn btn-primary btn-sm" id="btn-simulate-dc" disabled>▶ Simular DC</button>
            </div>
          </div>
          <div class="card-body p-0">
            <svg id="circuit-canvas" class="circuit-canvas" viewBox="0 0 600 400"
                 role="img" aria-label="Diagrama del circuito"></svg>
          </div>
        </div>
      </section>

      <!-- Resultados -->
      <section class="col-12 col-lg-4">
        <div class="card shadow-sm h-100">
          <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs">
              <li class="nav-item"><button class="nav-link active">DC</button></li>
              <li class="nav-item"><button class="nav-link disabled" title="Fase 3">AC</button></li>
              <li class="nav-item"><button class="nav-link disabled" title="Fase 4">Transitorio</button></li>
            </ul>
          </div>
          <div class="card-body" id="results">
            <p class="text-body-secondary mb-0">Pulsa <strong>Simular DC</strong> para ver los resultados.</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- type="module" permite usar import/export entre archivos (requiere Live Server) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
